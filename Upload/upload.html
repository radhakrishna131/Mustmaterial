    }

      border-radius:8px;

      border:1px solid var(--border-color);
      color:var(--ink);
      font-family: var(--font-body);
    }
    #up-type{
      padding:12px;
      border-radius:8px;
      background:var(--glass);
      border: 1px solid var(--border-color);
      color:var(--ink);
      font-family: var(--font-body);
    }
    #up-subject:focus-within,#up-detail:focus-within { border-color: var(--text) }

    background: var(--glass);color: var(--text);padding: 4px 8px; border-radius: 4px; font-size: 11px; text-transform: uppercase;}

      font-size:14px;

<body class="light-theme">
<section class="sec1">
  <nav class="nav-bar">
    <div class="logo">
      <a onclick="history.back()"><img src="../assets/logo.webp" alt="Must Material"></a>
    </div>
    <div class="nav-btns">
      <button onclick="switchTheme()"><i class="fa-solid fa-moon theme-icon google"></i></button>
    </div>
  </nav>
</section>

<section style="min-height: 90vh; height: 100%; padding: 40px 20px;">

  <div class="tab-controls">
    <button id="btn-upload" class="tab-btn active" onclick="openTab('upload')">Upload Resource</button>
    <button id="btn-browse" class="tab-btn" onclick="openTab('browse')">Browse Materials</button>
  </div>

  <div id="tab-upload">
    <div class="upload-section">
      <div class="upload-icon"><i class="ph-fill ph-cloud-arrow-up"></i></div>
      <h2 class="upload-heading"style="">Upload a Resource</h2>
      <p class="upload-sub">Share notes, PYQs, or syllabi. All uploads are reviewed by our moderation team before going live.</p>
      
      <form id="upload-form">
          <input type="text" id="up-subject" placeholder="Resource Title (e.g., OS Notes)" required style="">
          <input type="text" name="name" id="up-name" placeholder="Enter your short name...">
          <input type="text" id="up-detail" placeholder="Details (e.g., B.Tech · CSE · Sem 1)">
          
          <select id="up-type" required style="">
              <option value="Material">Material</option>
              <option value="Manual">Manual</option>
              <option value="syllabus">Syllabus</option>
              <option value="pdf">PDF</option>
              <option value="Notes">Notes</option>
          </select>

          <div class="box">
            <label for="fileInput" class="upload-box" title="Click to choose files">
              <div class="upload-inside upload-icon">
                <i class="ph-fill ph-cloud-arrow-up"></i>
                <div class="item" >Click to select PDFs</div>
              </div>
            </label>
          </div>

          <input id="fileInput" type="file" accept="application/pdf" multiple style="display:none" />
          
          <button type="submit" class="upload-submit" >Submit Resource</button>
      </form>
    </div>
  </div>

  <div id="tab-browse" style="display: none; max-width: 100%; margin: 0 auto;">
    <h2 style="font-family: var(--serif);font-weight:800;" class="mb-6 p-2 text-center text-4xl text-[var(--text)]">Community <em style="color: var(--ink);">Resources</em></h2>
    <p style="font-size:14px;color:var(--text2);margin-bottom:32px;margin-top: 10px;text-align:center;">Find notes, syllabi, and PYQs uploaded by others.</p>
    <div style="display: flex;
    justify-content: center;
    align-items: center;">
    <div class="filter-container flex justify-center mb-xl" style="display: inline-flex;justify-content: center;justify-items: center;
    margin-bottom: 20px;width: auto;">
  <button onclick="applyFilter('All')">All</button>
  <button onclick="applyFilter('Notes')">Notes</button>
  <button onclick="applyFilter('Material')">Material</button>
  <button onclick="applyFilter('Manual')">Manual</button>
  <button onclick="applyFilter('Syllabus')">Syllabus</button>
</div>
</div>
    <div id="materials-feed">
      <div id="materials-list" class="resource-grid">
        </div>
    </div>
    
  </div>

  <div id="thankyouPopup" role="status" aria-hidden="true" style="display:none; position:fixed; bottom:20px; right:20px; background:#4CAF50; color:white; padding:15px; border-radius:8px; z-index:1000;">
    <div class="content">
      <div class="title" style="font-weight:bold;">Thank you!</div>
      <div class="subtitle" id="thankSubtitle">Your file(s) were uploaded successfully.</div>
    </div>
  </div>
</section>

<footer class="sec-5" id="footer"></footer>

<script>
  function openTab(tabName) {
    // Hide all tabs
    document.getElementById('tab-upload').style.display = 'none';
    document.getElementById('tab-browse').style.display = 'none';
    
    // Remove active class from all buttons
    document.getElementById('btn-upload').classList.remove('active');
    document.getElementById('btn-browse').classList.remove('active');
    
    // Show the selected tab and add active class to its button
    document.getElementById('tab-' + tabName).style.display = 'block';
    document.getElementById('btn-' + tabName).classList.add('active');
  }
</script>

<script type="module" src="upload.js"></script>
