  <!-- ============================================================
       STRUCTURED DATA – Organization + WebSite (JSON-LD)
       Enables Google Search Logo & Sitelinks Searchbox
  ============================================================ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://mustmaterial.vercel.app/#organization",
        "url": "https://mustmaterial.vercel.app/",
        "name": "Must Material",
        "alternateName": "MustMaterial",
        "description": "Free study notes, PDF downloads, and educational resources for students.",
        "logo": {
          "@type": "ImageObject",
          "url": "https://mustmaterial.vercel.app/assets/icon.png",
          "width": 512,
          "height": 512
        },
        "publisher": {
          "@type": "Organization",
          "name": "Must Material",
          "logo": {
            "@type": "ImageObject",
            "url": "https://mustmaterial.vercel.app/assets/icon.png"
          }
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://mustmaterial.vercel.app/#website",
        "url": "https://mustmaterial.vercel.app/",
        "name": "Must Material",
        "description": "Free study notes, PDF downloads, and educational resources for students.",
        "publisher": {
          "@id": "https://mustmaterial.vercel.app/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://mustmaterial.vercel.app/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "inLanguage": "en-IN"
      }
    ]
  }
  </script>
