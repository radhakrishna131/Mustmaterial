  <!-- Folder page extra styles (inline — tiny, no extra file needed) -->
  <style>
    .folder-page-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 50px;
      margin-bottom: 10px;
      text-align: center;
    }

    .folder-page-header .folder-big-icon {
      font-size: 48px;
      color: var(--text);
    }

    .folder-page-header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--primary-color);
      font-weight: 700;
      line-height: 1.2;
    }

    .folder-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--cards);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .folder-back-link:hover {
      border-color: var(--text);
      box-shadow: var(--box-shadow);
    }

    @media (max-width: 600px) {
      .folder-page-header .folder-big-icon {
        font-size: 36px;
      }
    }
  </style>

  <section class="part-1">
    <div class="part-1-1">

      <!-- Folder title area -->
      <div class="part-1-1-1">
        <div class="folder-page-header">
          <i class="fa-solid fa-folder-open folder-big-icon"></i>
          <!-- folderTitle is filled dynamically by folder.js -->
          <h1 id="folderTitle">Loading…</h1>
          <!-- backLink href + text filled dynamically by folder.js -->
          <a id="backLink" href="BtechFirstYear.html" class="folder-back-link">
            ← Back to First Year
          </a>
        </div>
      </div>

      <!-- Materials grid — populated by folder.js -->
      <div class="materials-grid" id="materialsContainer">
      </div>

    </div>
  </section>
